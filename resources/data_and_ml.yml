# Phases 1-2: hourly ingest -> declarative pipeline -> forecast -> Lakebase sync -> governance,
# plus the self-improving model lifecycle (weekly retrain, triggered evaluation, daily monitor) and the experiment.
resources:
  volumes:
    aeso_raw:                       # landing zone: the ingest notebooks write raw AESO files here, the pipeline reads them
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: raw
      comment: Raw AESO API and report files as landed by the hourly job, one folder per feed. Ingested by the aeso-transform pipeline with Auto Loader.

  pipelines:
    aeso_transform:
      name: aeso-transform
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      channel: CURRENT
      configuration:
        aeso.catalog: ${var.catalog}
        aeso.schema: ${var.schema}
        aeso.landing: /Volumes/${var.catalog}/${var.schema}/raw
      libraries:
        - file:
            path: ../src/pipeline/ingest.py           # raw landing files -> bronze streaming tables -> conformed silver
        - file:
            path: ../src/pipeline/transformations.py  # conformed silver -> modelling silver -> gold

  experiments:
    aeso_forecast:
      name: /Workspace/Users/${workspace.current_user.userName}/aeso-market-pulse/aeso_pool_price_forecast

  jobs:
    aeso_hourly:
      name: aeso-hourly
      description: Hourly AESO ingest, transform, forecast and governance for AESO Market Pulse.
      schedule:
        quartz_cron_expression: "0 20 * * * ?"   # 20 past each hour, after AESO settles the previous hour
        timezone_id: America/Edmonton
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: full_refresh          # true re-pulls metered wind/solar and supply/demand history from 2026-01-01
          default: "false"
        - name: run_backtest          # true also re-scores @champion walk-forward on the latest 14 day-ahead days
          default: "false"
      tasks:
        - task_key: ingest_pool_price
          notebook_task:
            notebook_path: ../src/ingest/pool_price_incremental.py
        - task_key: ingest_wind_solar_forecast
          notebook_task:
            notebook_path: ../src/ingest/wind_solar_forecast.py
        - task_key: ingest_wind_solar_metered
          notebook_task:
            notebook_path: ../src/ingest/wind_solar_metered.py
        - task_key: ingest_outage_outlook     # daily + monthly outage reports (app card, archived per run)
          notebook_task:
            notebook_path: ../src/ingest/outage_outlook.py
        - task_key: ingest_supply_demand
          depends_on:
            - task_key: ingest_wind_solar_forecast   # its snapshot archive includes the 7-day wind/solar forecast
          notebook_task:
            notebook_path: ../src/ingest/supply_demand.py
        - task_key: transform
          depends_on:
            - task_key: ingest_pool_price
            - task_key: ingest_wind_solar_forecast
            - task_key: ingest_wind_solar_metered
            - task_key: ingest_supply_demand
          pipeline_task:
            pipeline_id: ${resources.pipelines.aeso_transform.id}
        - task_key: forecast
          depends_on:
            - task_key: transform
          notebook_task:
            notebook_path: ../src/ml/pool_price_forecast.py
            base_parameters:
              experiment: ${resources.experiments.aeso_forecast.name}
        - task_key: lakebase_sync
          depends_on:
            - task_key: forecast
          notebook_task:
            notebook_path: ../src/lakebase/sync_and_copy_back.py
        - task_key: governance
          depends_on:
            - task_key: lakebase_sync
          notebook_task:
            notebook_path: ../src/governance/setup_uc.py
    # Self-improving model lifecycle: weekly challenger -> model update trigger -> gated promotion; daily monitor.
    aeso_weekly_retrain:
      name: aeso-weekly-retrain
      description: Tune a challenger recipe, retrain on all history, register it and set @challenger.
      schedule:
        quartz_cron_expression: "0 30 5 ? * MON"   # Mondays 05:30 MPT
        timezone_id: America/Edmonton
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: candidate             # blank = tune and pick; a grid name (e.g. cushion_gate_1000-2500) = submit it
          default: ""
      tasks:
        - task_key: train_challenger
          notebook_task:
            notebook_path: ../src/ml/train_challenger.py
            base_parameters:
              experiment: ${resources.experiments.aeso_forecast.name}

    aeso_evaluate_challenger:
      name: aeso-evaluate-challenger
      description: Runs when @challenger is set on pool_price_ensemble. Backtests challenger vs champion on the same days and promotes only if better.
      trigger:
        pause_status: UNPAUSED
        model:
          securable_name: ${var.catalog}.${var.schema}.pool_price_ensemble
          condition: MODEL_ALIAS_SET
          aliases: [challenger]
          min_time_between_triggers_seconds: 300
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: events
          default: "{{job.trigger.model.updates}}"
      tasks:
        - task_key: evaluate_and_promote
          notebook_task:
            notebook_path: ../src/ml/evaluate_challenger.py
            base_parameters:
              experiment: ${resources.experiments.aeso_forecast.name}
        - task_key: business_value
          depends_on:
            - task_key: evaluate_and_promote
          notebook_task:
            notebook_path: ../src/ml/business_value.py
        - task_key: rebaseline           # refresh the multi-window score the app shows, for the resulting champion
          depends_on:
            - task_key: evaluate_and_promote
          notebook_task:
            notebook_path: ../src/ml/rebaseline_windows.py
            base_parameters:
              versions: champion
              windows: latest,2026-08-20,2026-05-15
        - task_key: governance
          depends_on:
            - task_key: business_value
            - task_key: rebaseline
          notebook_task:
            notebook_path: ../src/governance/setup_uc.py

    aeso_daily_monitor:
      name: aeso-daily-monitor
      description: Score archived forecasts against settled prices; fail (and email) on drift.
      schedule:
        quartz_cron_expression: "0 45 6 * * ?"   # 06:45 MPT, after yesterday's prices settle
        timezone_id: America/Edmonton
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: live_accuracy_and_drift
          notebook_task:
            notebook_path: ../src/ml/daily_monitor.py
        - task_key: price_drivers          # what drives the price: explained variance per fundamental (Genie, evidence)
          notebook_task:
            notebook_path: ../src/ml/price_drivers.py
    aeso_rebaseline:
      name: aeso-rebaseline
      description: Score registered versions walk-forward on several 14-day windows, day-ahead features only (manual).
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: versions
          default: "5,champion"
        - name: windows
          default: "latest,2026-08-20,2026-05-15"
      tasks:
        - task_key: rebaseline_windows
          notebook_task:
            notebook_path: ../src/ml/rebaseline_windows.py
