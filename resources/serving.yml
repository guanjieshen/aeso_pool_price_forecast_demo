# Phases 3-4: Lakebase project + synced tables, the AESO Market Pulse app, and the Genie space.
# App command and env live in app/app.yaml.
resources:
  postgres_projects:
    aeso_market_pulse_db:
      project_id: aeso-market-pulse
      display_name: AESO Market Pulse
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 1

  postgres_synced_tables:
    forecast_latest:
      synced_table_id: ${var.catalog}.${var.schema}.forecast_latest_synced
      source_table_full_name: ${var.catalog}.${var.schema}.aeso_price_forecast_output
      branch: projects/${resources.postgres_projects.aeso_market_pulse_db.project_id}/branches/production
      postgres_database: databricks_postgres
      primary_key_columns: [forecast_datetime_mpt]
      scheduling_policy: SNAPSHOT
      new_pipeline_spec:
        storage_catalog: ${var.catalog}
        storage_schema: ${var.schema}
    pool_price_hourly:
      synced_table_id: ${var.catalog}.${var.schema}.pool_price_hourly_synced
      source_table_full_name: ${var.catalog}.${var.schema}.silver_pool_price_hourly
      branch: projects/${resources.postgres_projects.aeso_market_pulse_db.project_id}/branches/production
      postgres_database: databricks_postgres
      primary_key_columns: [begin_datetime_utc]
      scheduling_policy: SNAPSHOT
      new_pipeline_spec:
        storage_catalog: ${var.catalog}
        storage_schema: ${var.schema}
  apps:
    aeso_market_pulse:
      name: aeso-market-pulse
      description: "AESO Market Pulse: live Alberta pool price, 24h regime-aware forecast and ops actions for pipeline power cost"
      source_code_path: ../app
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: projects/${resources.postgres_projects.aeso_market_pulse_db.project_id}/branches/production
            database: projects/${resources.postgres_projects.aeso_market_pulse_db.project_id}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
  genie_spaces:
    aeso_market_pulse_genie:
      title: AESO Market Pulse Genie
      description: Ask about Alberta pool prices, the 24h regime-aware forecast, model accuracy and ops actions (Enbridge Liquids Pipelines power cost).
      warehouse_id: ${var.warehouse_id}
      parent_path: /Workspace/Users/${workspace.current_user.userName}/aeso-market-pulse
      file_path: ../src/genie/aeso_market_pulse.geniespace.json
